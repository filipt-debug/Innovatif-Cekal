<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Dashboard - Change Request Review</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <h1>Change Request Dashboard</h1>
                <p class="header-subtitle">Assembly Process Evaluation</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" id="exportBtn">Exportera rapport</button>
            </div>
        </header>

        <!-- Summary Cards -->
        <section class="summary-section">
            <h2>Sammanfattning</h2>
            <div class="summary-grid" id="summaryGrid">
                <!-- Populated by JavaScript -->
            </div>
        </section>

        <!-- CR List -->
        <section class="cr-section">
            <div class="section-header">
                <h2>Change Requests</h2>
                <span class="cr-count" id="crCount">0 st</span>
            </div>

            <div class="cr-list" id="crList">
                <!-- CR Cards populated by JavaScript -->
            </div>
        </section>

        <!-- Comments Overview -->
        <section class="comments-section">
            <h2>Alla kommentarer</h2>
            <div class="comments-list" id="allComments">
                <p class="empty-state">Inga kommentarer ännu. Kommentarer läggs till under presentationer.</p>
            </div>
        </section>
    </div>

    <!-- Modal for viewing/editing CR details -->
    <div class="modal" id="crModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">CR Detaljer</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
